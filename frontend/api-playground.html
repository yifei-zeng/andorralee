<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Andorralee API Playground</title>
  <style>
    body{font-family:Segoe UI,Arial,sans-serif;background:#f6f7f9;margin:0;padding:16px;font-size:14px}
    .wrap{max-width:1200px;margin:0 auto}
    h1{margin:0 0 12px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:12px}
    label{display:block;font-size:12px;color:#555;margin:6px 0 2px}
    input,select,textarea{width:100%;padding:8px;border:1px solid #d1d5db;border-radius:6px;font-size:13px}
    button{padding:8px 12px;border:none;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer;margin-right:6px}
    button.secondary{background:#10b981}
    .result{background:#0b1220;color:#d1e7ff;border-radius:6px;padding:10px;white-space:pre-wrap;min-height:160px;overflow:auto}
    .row{display:flex;gap:8px;align-items:center}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Andorralee API Playground</h1>
    <div class="grid">
      <div class="card">
        <h3>基础配置</h3>
        <label>API Base</label>
        <input id="base" value="/api/v1" />
        <div class="row">
          <button onclick="ping()">健康检查</button>
          <button class="secondary" onclick="listContainers()">临时容器列表</button>
        </div>
      </div>

      <div class="card">
        <h3>病毒扫描</h3>
        <label>选择文件</label>
        <input id="file" type="file" />
        <div class="row">
          <button onclick="uploadScan()">上传并扫描</button>
          <button class="secondary" onclick="scanStats()">统计</button>
        </div>
        <label>URL 扫描</label>
        <div class="row"><input id="scanUrl" placeholder="https://example.com/file" /><button onclick="urlScan()">扫描URL</button></div>
        <div id="scanSummary"></div>
      </div>

      <div class="card">
        <h3>威胁情报</h3>
        <div class="row"><button onclick="saveIntel()">保存情报</button><button onclick="getIntel()">查询情报</button></div>
      </div>

      <div class="card">
        <h3>攻击会话</h3>
        <div class="row"><button onclick="startSession()">开始会话</button><button onclick="addEvent()">添加事件</button></div>
        <label>会话ID</label>
        <input id="sid" />
        <div class="row"><button onclick="getSession()">查询会话</button><button onclick="endSession()">结束会话</button></div>
      </div>

      <div class="card" style="grid-column:1/3">
        <h3>结果</h3>
        <div id="out" class="result">等待操作...</div>
      </div>
    </div>
  </div>

  <script>
    function base(){return document.getElementById('base').value || '/api/v1'}
    function show(obj){document.getElementById('out').textContent=typeof obj==='string'?obj:JSON.stringify(obj,null,2)}
    async function call(p,opts){const r=await fetch(base()+p,opts); const j=await r.json(); show(j); return j}

    async function ping(){return call('/health')}
    async function listContainers(){return call('/temp-containers')}

    async function uploadScan(){
      const f=document.getElementById('file').files[0]; if(!f){return alert('请选择文件')}
      const fd=new FormData(); fd.append('file',f);
      const r=await fetch(base()+'/malware/scan/file',{method:'POST',body:fd}); const j=await r.json(); show(j); renderSummary(j);
    }
    async function scanStats(){return call('/malware/statistics')}
    async function urlScan(){const u=document.getElementById('scanUrl').value; if(!u){return alert('请输入URL')} return call('/malware/scan/url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})})}

    async function saveIntel(){return call('/threat/intelligence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({indicator_type:'ip',indicator_value:'1.2.3.4',threat_type:'scanner',severity:'medium',confidence:60,is_active:true})})}
    async function getIntel(){return call('/threat/intelligence?type=ip&value=1.2.3.4')}

    async function startSession(){const r=await call('/threat/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_ip:'8.8.8.8',protocol:'ssh'})}); if(r&&r.data&&r.data.session_id){document.getElementById('sid').value=r.data.session_id}}
    async function addEvent(){const sid=document.getElementById('sid').value; if(!sid){return alert('先开始会话')} return call('/threat/sessions/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,event_type:'command',command:'whoami'})})}
    async function getSession(){const sid=document.getElementById('sid').value; if(!sid){return alert('请输入会话ID')} return call('/threat/sessions/'+encodeURIComponent(sid))}
    async function endSession(){const sid=document.getElementById('sid').value; if(!sid){return alert('请输入会话ID')} return call('/threat/sessions/'+encodeURIComponent(sid)+'/end',{method:'PUT'})}

    function renderSummary(r){try{const s=r.summary; if(!s) return; const el=document.getElementById('scanSummary'); el.innerHTML = `
      <div style="margin-top:8px;padding:8px;border:1px solid #e5e7eb;border-radius:6px">
        <div><b>ID:</b> ${s.id ?? '-'} | <b>文件:</b> ${s.file_name} | <b>大小:</b> ${s.file_size} bytes</div>
        <div><b>感染:</b> ${s.is_infected} | <b>等级:</b> ${s.threat_level} | <b>威胁数:</b> ${s.threat_count}</div>
        <div><b>时间:</b> ${s.scan_time} | <b>耗时:</b> ${s.scan_duration_ms}ms</div>
        <div><b>SHA256:</b> ${s.sha256}</div>
        <div><b>MD5:</b> ${s.md5}</div>
        <div><b>来源IP:</b> ${s.source_ip}</div>
      </div>`;}catch(e){}
    }
  </script>
</body>
</html>
