version: '3.8'

services:
  andorralee:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: andorralee
    ports:
      - "9090:9090"
    environment:
      - DB_MODE=${DB_MODE:-mysql}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
      - MYSQL_DATABASE=andorralee
      - DAMENG_HOST=dameng
      - DAMENG_PORT=5236
      - DAMENG_USER=SYSDBA
      - DAMENG_PASSWORD=Dm123456
      - DAMENG_DATABASE=DOCKER_OPS
    depends_on:
      - mysql
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dm_home:/app/dm_home
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: andorralee-mysql
    ports:
      - "13306:3306"  # 映射为宿主 13306
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deployment/create_tables.sql:/docker-entrypoint-initdb.d/1_create_tables.sql:ro
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=andorralee
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 达梦占位服务 (默认不启动). 实际测试使用本地已安装实例。
  dameng:
    image: alpine:3.19
    container_name: andorralee-dameng-placeholder
    command: ["/bin/sh", "-c", "sleep infinity"]
    deploy:
      replicas: 0
    restart: "no"

volumes:
  mysql_data: